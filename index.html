<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>PT Manager V2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>')}</script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18202b;--muted:#6b7280;--line:#e5e7eb;--p:#2563eb;--danger:#dc2626;--ok:#059669;--warn:#d97706;--shadow:0 10px 30px #0f172a14;--r:18px}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{height:70px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-weight:850;font-size:20px}.brand b{color:#60a5fa}.user{display:flex;align-items:center;gap:12px;font-size:14px}.layout{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 70px)}aside{background:#fff;border-right:1px solid var(--line);padding:20px 12px}.nav{width:100%;text-align:left;border:0;background:transparent;padding:13px 14px;border-radius:12px;margin-bottom:5px;color:#4b5563;font-weight:750}.nav.active,.nav:hover{background:#eff6ff;color:#1d4ed8}main{padding:30px;max-width:1450px;width:100%;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.head h1{margin:0 0 6px;font-size:30px}.head p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}.stat,.card,.client{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}.stat{padding:20px}.label{color:var(--muted);font-size:12px;font-weight:800}.num{font-size:30px;font-weight:900;margin-top:6px}.card{padding:22px}.clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}.client{padding:18px;box-shadow:none}.ctop{display:flex;justify-content:space-between;gap:10px}.who{display:flex;gap:12px;align-items:center}.avatar{width:45px;height:45px;border-radius:14px;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:900}.name{font-weight:850;font-size:17px}.muted{color:var(--muted)}.info{font-size:14px;line-height:1.7;margin:14px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:750}.primary{background:var(--p);color:#fff}.light{background:#eef2ff;color:#1e40af}.danger{background:#fee2e2;color:#991b1b}.ghost{background:transparent;color:inherit;border:1px solid #ffffff2e}.small{padding:8px 11px;font-size:13px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:850}.active{background:#dcfce7;color:#166534}.expiring{background:#fef3c7;color:#92400e}.expired{background:#fee2e2;color:#991b1b}.none{background:#f3f4f6;color:#6b7280}.notice{padding:14px 16px;border-radius:13px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;margin-bottom:18px;font-weight:750}.empty{text-align:center;padding:42px;color:var(--muted)}.input{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:11px 12px;background:#fff;outline:0}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px #dbeafe}.toolbar{margin-bottom:16px;max-width:450px}.loginwrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#eef4ff,#f8fafc)}.login{width:min(430px,100%);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:24px;padding:30px}.login h1{margin:0 0 7px}.login p{color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.error{background:#fee2e2;color:#991b1b;padding:11px;border-radius:10px;margin:12px 0;font-size:14px}.modalbg{position:fixed;inset:0;background:#0f172a8c;display:grid;place-items:center;padding:18px;z-index:50}.modal{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:25px}.modal h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.detail{display:flex;align-items:center;gap:14px;margin-bottom:20px}.back{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 12px}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{border:0;background:transparent;padding:12px 15px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}.tab.sel{color:var(--p);border-bottom-color:var(--p)}.exercise{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.exercise strong{display:block;margin-bottom:5px}.exercise small{color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow:auto;padding:10px}.nav{width:auto;white-space:nowrap}.stats{grid-template-columns:1fr 1fr}main{padding:20px}}@media(max-width:600px){.top{padding:0 15px}.user span{display:none}.head{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div id="root"></div>
<script>
const URL="https://rzfxqxmwcwxgagjfajbs.supabase.co", KEY="sb_publishable_6Cp0EMJl7cBG_ISCF73L8g_o72RCQTF";
if(!window.supabase){document.body.innerHTML='<div class="loginwrap"><div class="login"><h2>PT Manager V2</h2><p>Impossibile caricare la libreria Supabase. Controlla la connessione internet e ricarica la pagina.</p></div></div>';throw new Error("Supabase JS library not loaded")} const db=supabase.createClient(URL,KEY);const S={session:null,profile:null,clients:[],client:null,plan:null,ex:[],view:"dash",search:""};
const $=x=>document.getElementById(x), esc=x=>String(x??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials=n=>String(n||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
const date=d=>d?new Date(d+"T00:00:00").toLocaleDateString("it-IT"):"—";
function status(p){if(!p)return["none","Nessuna scheda"];let d=Math.ceil((new Date(p.end_date+"T23:59:59")-new Date())/86400000);if(d<0)return["expired","Scaduta"];if(d<=7)return["expiring","Scade tra "+d+" gg"];return["active","Attiva"]}
function login(){root.innerHTML='<div class="loginwrap"><div class="login"><h1>PT Manager <span style="color:#2563eb">V2</span></h1><p>Gestione clienti e schede di allenamento.</p><div id="err"></div><div class="field"><label>Email</label><input id="email" class="input" type="email"></div><div class="field"><label>Password</label><input id="pass" class="input" type="password"></div><button class="btn primary" style="width:100%" onclick="signin()">Accedi</button></div></div>'}
async function signin(){let email=$("email").value.trim(),password=$("pass").value;if(!email||!password){$("err").innerHTML='<div class="error">Inserisci email e password.</div>';return}$("err").innerHTML='<div class="muted">Accesso…</div>';let r=await db.auth.signInWithPassword({email,password});if(r.error)$("err").innerHTML='<div class="error">'+esc(r.error.message)+'</div>'}
async function boot(){let {data:{session}}=await db.auth.getSession();if(!session){login();return}S.session=session;let r=await db.from("profiles").select("*").eq("id",session.user.id).single();if(r.error||!r.data){root.innerHTML='<div class="loginwrap"><div class="login"><h2>Profilo non trovato</h2><p>Controlla la tabella profiles.</p><button class="btn primary" onclick="logout()">Esci</button></div></div>';return}S.profile=r.data;if(S.profile.role!=="pt"){root.innerHTML='<div class="loginwrap"><div class="login"><h2>Accesso non autorizzato</h2><p>Questo account non è configurato come PT.</p><button class="btn primary" onclick="logout()">Esci</button></div></div>';return}await loadClients();app()}
db.auth.onAuthStateChange((_e,s)=>{if(!s){S.session=null;login()}});
async function loadClients(){let r=await db.from("clients").select("*,plans(*)").eq("pt_id",S.session.user.id).order("full_name");if(!r.error)S.clients=(r.data||[]).map(c=>{c.currentPlan=(c.plans||[]).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date))[0]||null;return c})}
function app(){root.innerHTML='<div class="top"><div class="brand">PT <b>Manager</b> <small>V2</small></div><div class="user"><span>'+esc(S.profile.full_name||S.session.user.email)+'</span><button class="btn ghost small" onclick="logout()">Esci</button></div></div><div class="layout"><aside><button class="nav '+(S.view==="dash"?'active':'')+'" onclick="go(\'dash\')">📊 Dashboard</button><button class="nav '+(S.view==="clients"?'active':'')+'" onclick="go(\'clients\')">👥 Clienti</button></aside><main id="main"></main></div>';S.view==="dash"?dashboard():S.view==="clients"?clients():detail()}
function go(v){S.view=v;S.client=null;app()}
function dashboard(){let total=S.clients.length,act=S.clients.filter(c=>status(c.currentPlan)[0]==="active").length,exp=S.clients.filter(c=>status(c.currentPlan)[0]==="expiring").length,bad=S.clients.filter(c=>status(c.currentPlan)[0]==="expired").length;main.innerHTML='<div class="head"><div><h1>Dashboard</h1><p>Panoramica del tuo studio.</p></div><button class="btn primary" onclick="clientModal()">+ Nuovo cliente</button></div>'+(exp+bad?'<div class="notice">⚠️ Hai '+(exp+bad)+' schede che richiedono attenzione.</div>':'')+'<div class="stats"><div class="stat"><div class="label">CLIENTI</div><div class="num">'+total+'</div></div><div class="stat"><div class="label">SCHEDE ATTIVE</div><div class="num">'+act+'</div></div><div class="stat"><div class="label">IN SCADENZA</div><div class="num">'+exp+'</div></div><div class="stat"><div class="label">SCADUTE</div><div class="num">'+bad+'</div></div></div><div class="card"><h2 style="margin-top:0">Clienti da controllare</h2>'+list("attention")+'</div>'}
function clients(){main.innerHTML='<div class="head"><div><h1>Clienti</h1><p>Gestisci anagrafiche e schede.</p></div><button class="btn primary" onclick="clientModal()">+ Nuovo cliente</button></div><div class="card"><div class="toolbar"><input class="input" placeholder="Cerca cliente…" value="'+esc(S.search)+'" oninput="S.search=this.value;clients()"></div>'+list("all")+'</div>'}
function list(mode){let a=S.clients;if(mode==="attention")a=a.filter(c=>["expiring","expired"].includes(status(c.currentPlan)[0]));if(S.search)a=a.filter(c=>c.full_name.toLowerCase().includes(S.search.toLowerCase()));if(!a.length)return'<div class="empty">Nessun cliente da mostrare.</div>';return'<div class="clients">'+a.map(c=>{let st=status(c.currentPlan);return'<div class="client"><div class="ctop"><div class="who"><div class="avatar">'+esc(initials(c.full_name))+'</div><div><div class="name">'+esc(c.full_name)+'</div><div class="muted">'+esc(c.email||"Nessuna email")+'</div></div></div><span class="badge '+st[0]+'">'+esc(st[1])+'</span></div><div class="info"><b>Scheda:</b> '+esc(c.currentPlan?.name||"Nessuna")+'<br><b>Periodo:</b> '+(c.currentPlan?date(c.currentPlan.start_date)+" → "+date(c.currentPlan.end_date):"—")+'</div><div class="actions"><button class="btn light small" onclick="openClient(\''+c.id+'\')">Apri cliente</button><button class="btn small" onclick="clientModal(\''+c.id+'\')">Modifica</button></div></div>'}).join("")+'</div>'}
async function openClient(id){S.client=S.clients.find(c=>c.id===id);S.plan=S.client?.currentPlan||null;await loadEx();S.view="detail";app()}
async function loadEx(){if(!S.plan){S.ex=[];return}let r=await db.from("plan_exercises").select("*").eq("plan_id",S.plan.id).order("exercise_order");S.ex=r.data||[]}
function detail(){if(!S.client){go("clients");return}let c=S.client,p=S.plan;main.innerHTML='<div class="detail"><button class="back" onclick="go(\'clients\')">← Indietro</button><div class="avatar">'+esc(initials(c.full_name))+'</div><div><h1 style="margin:0">'+esc(c.full_name)+'</h1><div class="muted">'+esc(c.email||"")+'</div></div></div><div class="tabs"><button id="tplan" class="tab sel" onclick="tab(\'plan\')">Scheda</button><button id="thist" class="tab" onclick="tab(\'history\')">Storico</button><button id="tprog" class="tab" onclick="tab(\'progress\')">Progressi</button></div><div id="content"></div>';tab("plan")}
function tab(t){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("sel"));$(t==="plan"?"tplan":t==="history"?"thist":"tprog").classList.add("sel");if(t==="plan"){$("content").innerHTML='<div class="card"><div class="head" style="margin-bottom:15px"><div><h2 style="margin:0">'+esc(S.plan?.name||"Nessuna scheda")+'</h2><p>'+(S.plan?"Dal "+date(S.plan.start_date)+" al "+date(S.plan.end_date):"Crea una scheda per questo cliente.")+'</p></div><div class="actions">'+(S.plan?'<span class="badge '+status(S.plan)[0]+'">'+status(S.plan)[1]+'</span><button class="btn light small" onclick="planModal(\''+S.plan.id+'\')">Modifica scheda</button>':'')+'<button class="btn primary small" onclick="planModal()">+ Nuova scheda</button></div></div>'+(S.plan?exerciseHtml():'<div class="empty">Nessuna scheda assegnata.</div>')+'</div>'}else if(t==="history")$("content").innerHTML='<div class="card"><h2>Storico allenamenti</h2><div class="empty">Collegheremo qui lo storico completo nella prossima fase.</div></div>';else $("content").innerHTML='<div class="card"><h2>Progressi</h2><div class="empty">Qui aggiungeremo peso, carichi, misure e grafici.</div></div>'}
function exerciseHtml(){if(!S.ex.length)return'<div class="empty">Nessun esercizio.<br><br><button class="btn primary" onclick="exModal()">+ Aggiungi esercizio</button></div>';return'<div style="display:flex;justify-content:space-between;align-items:center"><h3>Esercizi</h3><button class="btn primary small" onclick="exModal()">+ Aggiungi esercizio</button></div>'+S.ex.map(e=>'<div class="exercise"><div><strong>'+esc(e.exercise_name)+'</strong><small>'+esc(e.day_name)+' · '+(e.sets??"—")+' serie · '+esc(e.reps||"—")+' reps · '+(e.rest_seconds??"—")+'s recupero</small>'+(e.notes?'<div class="muted">'+esc(e.notes)+'</div>':'')+'</div><button class="btn danger small" onclick="delEx(\''+e.id+'\')">Elimina</button></div>').join("")}
function modal(body){document.body.insertAdjacentHTML("beforeend",'<div class="modalbg" id="modal"><div class="modal">'+body+'</div></div>')}
function close(){let x=$("modal");if(x)x.remove()}
function clientModal(id){let c=id?S.clients.find(x=>x.id===id):null;modal('<h2>'+(c?'Modifica cliente':'Nuovo cliente')+'</h2><div class="grid"><div class="field"><label>Nome e cognome</label><input id="cn" class="input" value="'+esc(c?.full_name||"")+'"></div><div class="field"><label>Email</label><input id="ce" class="input" type="email" value="'+esc(c?.email||"")+'"></div><div class="field"><label>Telefono</label><input id="cp" class="input" value="'+esc(c?.phone||"")+'"></div><div class="field full"><label>Note</label><textarea id="co" class="input" rows="3">'+esc(c?.notes||"")+'</textarea></div></div><div id="me"></div><div class="modalfoot"><button class="btn" onclick="close()">Annulla</button><button class="btn primary" onclick="saveClient(\''+(id||"")+'\')">Salva</button></div>')}
async function saveClient(id){let p={full_name:$("cn").value.trim(),email:$("ce").value.trim()||null,phone:$("cp").value.trim()||null,notes:$("co").value.trim()||null};if(!p.full_name){$("me").innerHTML='<div class="error">Inserisci il nome.</div>';return}let r=id?await db.from("clients").update(p).eq("id",id):await db.from("clients").insert({...p,pt_id:S.session.user.id});if(r.error){$("me").innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}close();await loadClients();if(id&&S.client)S.client=S.clients.find(x=>x.id===id);app()}
function planModal(id){let p=id?S.plan:null;modal('<h2>'+(p?'Modifica scheda':'Nuova scheda')+'</h2><div class="grid"><div class="field full"><label>Nome scheda</label><input id="pn" class="input" value="'+esc(p?.name||("Scheda "+S.client.full_name))+'"></div><div class="field"><label>Inizio</label><input id="ps" class="input" type="date" value="'+(p?.start_date||new Date().toISOString().slice(0,10))+'"></div><div class="field"><label>Fine</label><input id="pe" class="input" type="date" value="'+(p?.end_date||new Date(Date.now()+30*86400000).toISOString().slice(0,10))+'"></div><div class="field full"><label>Descrizione</label><textarea id="pd" class="input" rows="3">'+esc(p?.description||"")+'</textarea></div></div><div id="me"></div><div class="modalfoot"><button class="btn" onclick="close()">Annulla</button><button class="btn primary" onclick="savePlan(\''+(id||"")+'\')">Salva</button></div>')}
async function savePlan(id){let p={client_id:S.client.id,name:$("pn").value.trim(),start_date:$("ps").value,end_date:$("pe").value,description:$("pd").value.trim()||null};if(!p.name||!p.start_date||!p.end_date||p.end_date<p.start_date){$("me").innerHTML='<div class="error">Controlla nome e date.</div>';return}let r=id?await db.from("plans").update(p).eq("id",id):await db.from("plans").insert(p).select().single();if(r.error){$("me").innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}close();await loadClients();S.client=S.clients.find(x=>x.id===S.client.id);S.plan=id?S.client.plans.find(x=>x.id===id):r.data;await loadEx();app()}
function exModal(){modal('<h2>Aggiungi esercizio</h2><div class="grid"><div class="field full"><label>Esercizio</label><input id="en" class="input" placeholder="Panca piana"></div><div class="field"><label>Giorno</label><input id="ed" class="input" value="Giorno A"></div><div class="field"><label>Ordine</label><input id="eo" class="input" type="number" value="'+(S.ex.length+1)+'"></div><div class="field"><label>Serie</label><input id="es" class="input" type="number"></div><div class="field"><label>Ripetizioni</label><input id="er" class="input" placeholder="8-10"></div><div class="field"><label>Recupero secondi</label><input id="et" class="input" type="number"></div><div class="field"><label>Gruppo muscolare</label><input id="eg" class="input"></div><div class="field full"><label>Note</label><textarea id="enote" class="input" rows="3"></textarea></div></div><div id="me"></div><div class="modalfoot"><button class="btn" onclick="close()">Annulla</button><button class="btn primary" onclick="saveEx()">Aggiungi</button></div>')}
async function saveEx(){let p={plan_id:S.plan.id,exercise_name:$("en").value.trim(),day_name:$("ed").value.trim()||"Giorno A",exercise_order:Number($("eo").value)||1,sets:$("es").value?Number($("es").value):null,reps:$("er").value.trim()||null,rest_seconds:$("et").value?Number($("et").value):null,muscle_group:$("eg").value.trim()||null,notes:$("enote").value.trim()||null};if(!p.exercise_name){$("me").innerHTML='<div class="error">Inserisci l’esercizio.</div>';return}let r=await db.from("plan_exercises").insert(p);if(r.error){$("me").innerHTML='<div class="error">'+esc(r.error.message)+'</div>';return}close();await loadEx();app()}
async function delEx(id){if(!confirm("Eliminare questo esercizio?"))return;let r=await db.from("plan_exercises").delete().eq("id",id);if(r.error){alert(r.error.message);return}await loadEx();app()}
async function logout(){await db.auth.signOut()}boot();
</script></body></html>
